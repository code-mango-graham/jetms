<div class="app-content-header">
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-6">
        <h3 class="mb-0">Payments</h3>
      </div>
      <div class="col-sm-6">
        <ol class="breadcrumb float-sm-end">
          <li class="breadcrumb-item"><a href="#">Home</a></li>
          <li class="breadcrumb-item active" aria-current="page">Payments</li>
        </ol>
      </div>
    </div>
  </div>
</div>

<div class="app-content px-4">
  <div class="container-fluid">

    <div class="row g-3 mb-3">
      <div class="col-md-3">
        <div class="subpanel p-3 text-center h-100 d-flex flex-column justify-content-center">
          <div class="text-muted small">TOTAL COLLECTED</div>
          <div class="fs-3 fw-bold text-success" id="paymentsTotal">₱0.00</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="form-group">
          <label for="ledger_schoolyear_filter">School Year</label>
          <select class="form-select" id="ledger_schoolyear_filter">
            <option value="">All School Years</option>
          </select>
        </div>
      </div>
      <div class="col-md-3">
        <div class="form-group">
          <label for="ledger_date_from">From Date</label>
          <input type="date" class="form-control" id="ledger_date_from">
        </div>
      </div>
      <div class="col-md-3">
        <div class="form-group">
          <label for="ledger_date_to">To Date</label>
          <input type="date" class="form-control" id="ledger_date_to">
        </div>
      </div>
    </div>

    <div class="mb-3 d-flex gap-2">
      <button class="btn btn-primary btn-sm" id="btnApplyPaymentFilters">
        <i class="bi bi-funnel me-1"></i>Apply Filters
      </button>
      <button class="btn btn-outline-secondary btn-sm" id="btnClearPaymentFilters">
        <i class="bi bi-x-circle me-1"></i>Clear
      </button>
    </div>

    <ul class="nav nav-tabs mb-3" id="paymentsViewTabs">
      <li class="nav-item">
        <a class="nav-link active" href="#" data-view="ledger">Transactions</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#" data-view="daily">Totals per Date</a>
      </li>
    </ul>

    <div class="card" id="paymentsLedgerView">
      <div class="card-body">
        <table id="paymentsLedgerTable" class="table table-bordered table-hover nowrap w-100">
          <thead>
            <tr>
              <th>DATE</th>
              <th>STUDENT</th>
              <th>LRN</th>
              <th>LEVEL / SECTION</th>
              <th>SCHOOL YEAR</th>
              <th>AMOUNT</th>
              <th>MODE</th>
              <th>REFERENCE #</th>
              <th>RECORDED BY</th>
              <th width="80">ACTIONS</th>
            </tr>
          </thead>
        </table>
      </div>
    </div>

    <div class="card d-none" id="paymentsDailyView">
      <div class="card-body">
        <table id="paymentsDailyTable" class="table table-bordered table-hover nowrap w-100">
          <thead>
            <tr>
              <th>DATE</th>
              <th># OF PAYMENTS</th>
              <th>TOTAL COLLECTED</th>
            </tr>
          </thead>
        </table>
      </div>
    </div>

  </div>
</div>

<!-- ============================= -->
<!-- EDIT PAYMENT MODAL -->
<!-- ============================= -->
<div class="modal fade" id="editPaymentModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="editPaymentForm">
        <div class="modal-header">
          <h4 class="modal-title">Edit Payment</h4>
        </div>
        <div class="modal-body">
          <input type="hidden" id="edit_payment_id" name="payment_id">

          <div class="form-group mb-3">
            <label for="edit_payment_date">Date</label>
            <input type="date" class="form-control" id="edit_payment_date" name="payment_date" required>
          </div>
          <div class="form-group mb-3">
            <label for="edit_amount">Amount</label>
            <input type="number" class="form-control" id="edit_amount" name="amount" min="0" step="0.01" required>
          </div>
          <div class="form-group mb-3">
            <label for="edit_payment_mode">Mode</label>
            <select class="form-select" id="edit_payment_mode" name="payment_mode" required>
              <option value="">-- Select Mode --</option>
              <option value="Cash">Cash</option>
              <option value="GCash">GCash</option>
              <option value="Bank Transfer">Bank Transfer</option>
            </select>
          </div>
          <div class="form-group mb-3">
            <label for="edit_reference_no">Reference No.</label>
            <input type="text" class="form-control" id="edit_reference_no" name="reference_no">
          </div>
          <div class="form-group mb-0">
            <label for="edit_reason">Reason for Edit <span class="text-danger">*</span></label>
            <textarea class="form-control" id="edit_reason" name="reason" rows="2" placeholder="Required — why is this payment being changed?" required></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Save Changes</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
(function () {
    var s = document.createElement('script');
    s.src = 'jsfile/payments.js?v=' + Date.now();
    document.body.appendChild(s);
})();
</script>
