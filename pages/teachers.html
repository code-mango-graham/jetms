<!-- ============================= -->
<!-- BEGIN TEACHER MANAGEMENT -->
<!-- ============================= -->

<div class="card card-primary card-outline">

    <!-- CARD HEADER -->
    <div class="card-header">
        <h3 class="card-title fs-3 fw-bold">TEACHER MANAGEMENT</h3>

        <div class="card-tools">
            <button class="btn btn-primary btn-sm" id="btnAddTeacher">
                <i class="bi bi-plus-circle me-1"></i><B>Add Teacher</B>
            </button>
        </div>
    </div>

    <!-- ============================= -->
    <!-- BEGIN MODAL -->
    <!-- ============================= -->
    <div class="modal fade" id="teacherModal">

        <div class="modal-dialog modal-xl">
            <div class="modal-content">

                <form id="teacherForm">

                    <!-- MODAL HEADER -->
                    <div class="modal-header">
                        <h4 class="modal-title">Teacher</h4>
                    </div>

                    <!-- MODAL BODY -->
                    <div class="modal-body">

                        <input type="hidden" id="teacher_id" name="teacher_id">

                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label" for="last_name">Last Name</label>
                                <input type="text" class="form-control" id="last_name" name="last_name" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="first_name">First Name</label>
                                <input type="text" class="form-control" id="first_name" name="first_name" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="middle_name">Middle Name</label>
                                <input type="text" class="form-control" id="middle_name" name="middle_name">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="extension_name">Extension Name</label>
                                <input type="text" class="form-control" id="extension_name" name="extension_name">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="nick_name">Nickname / Alias</label>
                                <input type="text" class="form-control" id="nick_name" name="nick_name">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="gender">Gender</label>
                                <select class="form-select select2" id="gender" name="gender" required>
                                    <option value="">-- Select Gender --</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="birthday">Date of Birth</label>
                                <input type="date" class="form-control" id="birthday" name="birthday" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="date_hired">Date Hired</label>
                                <input type="date" class="form-control" id="date_hired" name="date_hired">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="phone_number">Phone Number</label>
                                <input type="tel" class="form-control" id="phone_number" name="phone_number" maxlength="11" inputmode="numeric" pattern="[0-9]{11}" placeholder="09XXXXXXXXX" title="11 digits, e.g. 09171234567">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="email">Email</label>
                                <input type="email" class="form-control" id="email" name="email">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="position_id">Position Title</label>
                                <select class="form-select select2" id="position_id" name="position_id" required>
                                    <option value="">-- Select Position --</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="department_id">Department / Unit</label>
                                <select class="form-select select2" id="department_id" name="department_id" required>
                                    <option value="">-- Select Department --</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- MODAL FOOTER -->
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-success">
                            Save
                        </button>

                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Close
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </div>
    <!-- ============================= -->
    <!-- END MODAL -->
    <!-- ============================= -->

    <!-- TABLE CARD BODY -->
    <div class="card-body">
        <table id="teachersTable" class="table table-bordered table-hover nowrap w-100">
            <thead>
                <tr>
                    <th>LAST NAME</th>
                    <th>FIRST NAME</th>
                    <th>MIDDLE NAME</th>
                    <th>EXTENSION NAME</th>
                    <th>NICKNAME/ALIAS</th>
                    <th>GENDER</th>
                    <th>BIRTHDAY</th>
                    <th>POSITION TITLE</th>
                    <th>OFFICE</th>
                    <th>DATE HIRED</th>
                    <th width="100">ACTIONS</th>
                </tr>
            </thead>
        </table>
    </div>

</div>

<!-- ============================= -->
<!-- END TEACHER MANAGEMENT -->
<!-- ============================= -->

<script>
(function () {
    var s = document.createElement('script');
    s.src = 'jsfile/teachers.js?v=' + Date.now();
    document.body.appendChild(s);
})();
</script>
<script>
$(document).ready(function () {
  $('.select2').select2({
    width: '100%',
    placeholder: 'Search and select',
    allowClear: true
  });

  $('#teacherModal').on('shown.bs.modal', function () {
    $('#teacherModal .select2').select2({
      width: '100%',
      dropdownParent: $('#teacherModal')
    });
  });
});
</script>
