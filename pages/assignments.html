<div class="card">
    <div class="card-header">
        <h3 class="card-title">Teacher Assignments</h3>
    </div>
    <div class="card-body">
        <div class="row mb-3">
            <div class="col-md-3">
                <label for="assignment_level" class="form-label">Level <span class="text-danger">*</span></label>
                <select class="form-control" id="assignment_level" name="assignment_level">
                    <option value="">Select Level</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="assignment_section" class="form-label">Section <span class="text-danger">*</span></label>
                <select class="form-control" id="assignment_section" name="assignment_section">
                    <option value="">Select Section</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">&nbsp;</label>
                <button type="button" class="btn btn-primary w-100" id="assignment_load_btn">Load Subjects</button>
            </div>
        </div>

        <div id="assignment_container" class="d-none">
            <div class="row">
                <!-- Subjects Panel -->
                <div class="col-md-4">
                    <div class="card card-outline card-primary">
                        <div class="card-header">
                            <h3 class="card-title">Subjects</h3>
                        </div>
                        <div class="card-body" id="subjects_list" style="max-height: 600px; overflow-y: auto;">
                            <!-- Subjects will be loaded here -->
                        </div>
                    </div>
                </div>

                <!-- Assignment Panel -->
                <div class="col-md-8">
                    <div class="card card-outline card-info">
                        <div class="card-header">
                            <h3 class="card-title" id="assignment_header">Subject Assignment</h3>
                        </div>
                        <div class="card-body" id="assignment_details">
                            <div class="alert alert-info text-center">
                                <p>Select a subject from the left panel</p>
                            </div>
                        </div>
                        <div class="card-footer">
                            <button type="button" class="btn btn-secondary" id="assignment_save_all">Save All for Section</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="jsfile/assignment.js"></script>
