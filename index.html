<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>JET Montessori School of Ramon, Incorporated</title>
    <link rel="icon" type="image/png" href="logos/logo1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#007bff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />

    <link rel="stylesheet" href="plugins/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="plugins/icons/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="adminlte/css/adminlte.css" />
    <link rel="stylesheet" href="plugins/sweetalert/sweetalert2.min.css" />

    <style>
      body.login-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0d6efd 0%, #084298 100%);
        padding: 1.5rem;
      }
      .login-box {
        width: 100%;
        max-width: 420px;
      }
      .login-logo img {
        height: 64px;
      }
      .role-tabs .nav-link {
        cursor: pointer;
      }
    </style>
  </head>
  <body class="login-page">
    <div class="login-box">
      <div class="login-logo mb-3 text-center">
        <img src="logos/logo2.png" alt="School Logo" />
        <h1 class="h4 text-white mt-2 mb-0">JET Montessori School</h1>
        <p class="text-white-50 mb-0">of Ramon, Incorporated</p>
      </div>

      <div class="card">
        <div class="card-body">
          <ul class="nav nav-pills nav-fill role-tabs mb-3" id="roleTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button type="button" class="nav-link active" data-role="student">Student</button>
            </li>
            <li class="nav-item" role="presentation">
              <button type="button" class="nav-link" data-role="teacher">Teacher</button>
            </li>
            <li class="nav-item" role="presentation">
              <button type="button" class="nav-link" data-role="admin">Admin</button>
            </li>
          </ul>

          <form id="loginForm" autocomplete="off">
            <input type="hidden" id="role" name="role" value="student" />

            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="username" name="username" required />
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password" required />
                <button type="button" class="btn btn-outline-secondary toggle-password" tabindex="-1">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100" id="btnLogin">
              Log in as <span id="roleLabel">Student</span>
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="jquery/jquery.min.js"></script>
    <script src="plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="plugins/sweetalert/sweetalert2.min.js"></script>
    <script src="jsfile/login.js"></script>
  </body>
</html>
