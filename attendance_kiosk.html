<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gate Attendance Kiosk</title>
  <link rel="icon" type="image/png" href="logos/logo1.png" />
  <link rel="stylesheet" href="plugins/bootstrap/css/bootstrap.min.css" />
  <link rel="stylesheet" href="plugins/icons/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="plugins/datatables/datatables.min.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <style>
    body {
      background: linear-gradient(160deg, #fbfcfd 0%, #f3f6f6 55%, #eef4f2 100%);
      min-height: 100vh;
    }
    .kiosk-shell {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .kiosk-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .kiosk-header img {
      height: 60px;
    }
  </style>
</head>
<body>
  <div class="kiosk-shell">
    <div class="kiosk-header">
      <img src="logos/logo2.png" alt="School Logo">
      <h3 class="fw-bold mt-2 mb-0">JET Montessori School</h3>
      <p class="text-muted mb-0">Gate Attendance</p>
    </div>

    <div class="card">
      <div class="card-body">
        <form id="scanForm" class="row g-2 align-items-end">
          <div class="col-md-8">
            <label class="form-label fw-bold" for="scan_lrn">Scan or Enter LRN</label>
            <input type="text" class="form-control form-control-lg" id="scan_lrn" placeholder="Scan ID or type LRN, then press Enter" autocomplete="off" autofocus>
          </div>
          <div class="col-md-4">
            <button type="submit" class="btn btn-primary btn-lg w-100">
              <i class="bi bi-check-circle me-1"></i>Log
            </button>
          </div>
        </form>

        <div id="scanResult" class="mt-3"></div>
      </div>
    </div>

    <div class="card mt-3">
      <div class="card-header bg-white d-flex align-items-center justify-content-between">
        <h6 class="fw-bold mb-0"><i class="bi bi-list-check me-1"></i>Today's Log</h6>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="btnRefreshLog">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
      </div>
      <div class="card-body">
        <table id="attendanceTable" class="table table-bordered table-hover compact w-100">
          <thead>
            <tr>
              <th>TIME</th>
              <th>STUDENT</th>
              <th>LRN</th>
              <th>TYPE</th>
            </tr>
          </thead>
        </table>
      </div>
    </div>
  </div>

  <script src="jquery/jquery.min.js"></script>
  <script src="plugins/datatables/datatables.min.js"></script>
  <script src="plugins/sweetalert/sweetalert2.min.js"></script>
  <script>
  (function () {
      var s = document.createElement('script');
      s.src = 'jsfile/attendance_kiosk.js?v=' + Date.now();
      document.body.appendChild(s);
  })();
  </script>
</body>
</html>
